  .card.peek { height:140px; margin-top:12px; -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent); }

  /* ---------- 5 分頁套件（依 §5 示意圖重繪） ---------- */
  .pager { position:relative; height:116px; margin-top:8px; }
  .pgrow { position:absolute; left:50%; top:14px; transform:translateX(-50%); display:flex; align-items:center; gap:2px; font-size:14px; color:#444; white-space:nowrap; }
  .pg { min-width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; border-radius:4px; }
  .pg.on { border:1px solid #555; color:#555; }
  .pg.arrow { color:#888; font-size:18px; }
  .pgto { margin:0 6px 0 10px; }
  .pgin { width:36px; height:36px; border:1px solid #aaa; border-radius:4px; background:#fff; margin:0 6px; }
  .nextbtn { position:absolute; left:50%; top:62px; transform:translateX(-50%); width:120px; height:36px; background:#555; color:#fff; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .pgsel { position:absolute; right:30px; top:14px; width:122px; height:36px; border:1px solid #bbb; border-radius:4px; background:#fff; color:#888; font-size:14px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; }
  .pager.narrow .pgrow { left:0; transform:none; }
  .pager.narrow .nextbtn { left:130px; transform:none; }
  .pager.narrow .pgsel { right:auto; left:270px; top:62px; }

  /* ---------- 空畫面 ---------- */
  .empty { text-align:center; position:relative; }
  .et { font-size:24px; font-weight:700; color:#000; }
  .ed { font-size:18px; color:#444; margin-top:10px; }
  .pbtn { display:inline-flex; align-items:center; justify-content:center; margin-top:22px; height:36px; padding:0 30px; background:#555; color:#fff; font-size:16px; border-radius:3px; }
  .nobtn { margin-top:20px; font-size:13px; color:#555; border:2px dashed #666; display:inline-block; padding:2px 12px; }

  /* ---------- S6 ---------- */
  .before { position:relative; margin:0 6px 4px; padding:10px 16px; border:2px dashed #666; background:#fff; display:flex; gap:22px; align-items:center; font-size:15px; color:#555; white-space:nowrap; }
  .before .chip { height:28px; font-size:14px; padding:0 10px; }
  .flow { margin:6px 6px 0; font-size:17px; font-weight:700; display:flex; gap:10px; align-items:center; }

  /* ---------- S7 並排對照 ---------- */
  .cmp { display:grid; grid-template-columns:1fr 1fr; gap:0; padding:8px 0 0; }
  .col { position:relative; padding:0 28px; }
  .col + .col { border-left:2px dashed #888; }
  .cmp-h { font-size:17px; font-weight:700; margin:0 0 30px; }
  .diff { margin:28px 28px 0; width:calc(100% - 56px); border-collapse:collapse; background:#fff; font-size:14px; }
  .diff th, .diff td { border:1px solid #888; padding:6px 10px; text-align:left; vertical-align:top; }
  .diff th { background:#e5e5e5; }

  /* ---------- 側欄 ---------- */
  .note { background:#fef9c3; border:1px solid #facc15; padding:12px; margin-bottom:14px; font-size:13.5px; line-height:1.55; }
  .note.q { border:2px dashed #a16207; background:#fffbe0; }
  .note h3 { font-size:14.5px; font-weight:700; margin:0 0 4px; }
  .note ul { margin:4px 0 0 16px; padding:0; list-style:disc; }
  .note code { font-family:ui-monospace,monospace; font-size:12px; background:#fff; border:1px solid #facc15; padding:0 3px; }
  /* ---------- 虛線框（標出有異動的區塊）與便利貼 ---------- */
  .hl { outline:2px dashed #555; outline-offset:5px; }
  .hl.q { outline-color:#b45309; }
  .hl.inl { display:inline-block; padding:4px 24px; }
  .grp { display:inline-flex; align-items:center; margin-left:35px; }
  .grp .t32 { margin-left:0; }
  [data-a]:not(.nextbtn) { position:relative; }
  .sticky { white-space:normal; text-align:left; font-weight:400; font-size:13.5px; letter-spacing:0; margin:0; cursor:default; position:absolute; background:#fef08a; border:1px solid #eab308; box-shadow:2px 3px 0 rgba(0,0,0,.18); padding:9px 11px; font-size:13.5px; line-height:1.55; color:#111; transform:rotate(-.6deg); z-index:40; }
  .sticky.q { background:#fff7e6; border:2px dashed #b45309; transform:rotate(.5deg); }
  .sticky .qh { display:block; color:#b45309; font-size:12.5px; margin-bottom:2px; }
  .sticky ul { margin:2px 0 0 16px; padding:0; list-style:disc; }
  .bl { position:absolute; left:-2px; top:-12px; background:#000; color:#fff; font-size:12.5px; font-weight:700; padding:0 8px; border-radius:9999px; }
  /* ---------- 重複履歷標籤 ---------- */
  .tg { display:inline-flex; align-items:center; height:28px; padding:0 10px; background:#E9E9E9; border-radius:3px; font-size:14px; color:#444; white-space:nowrap; position:relative; }
  .tg.new { background:#d8d8d8; color:#111; cursor:pointer; font-weight:500; }
  .tg.star i { font-style:normal; color:#777; font-size:13px; letter-spacing:1px; }
  .tip { position:absolute; left:0; top:calc(100% + 6px); background:#222; color:#fff; font-size:12px; padding:4px 9px; border-radius:3px; white-space:nowrap; z-index:5; font-weight:400; cursor:default; }
  .lcard { display:flex; gap:24px; margin:0 6px; padding:24px; background:#fff; border-radius:8px; min-height:230px; }
  .ph { width:110px; height:140px; flex:none; background:#e5e7eb; border:2px solid #000; display:flex; align-items:center; justify-content:center; color:#6b7280; font-weight:700; font-size:24px; }
  .lbody { flex:1; }
  .trow { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .phtxt { margin-top:22px; font-size:16px; color:#666; }
  .card.dup { height:232px; margin-top:9px; border-bottom:1px solid #d4d4d4; }
  .card.dup .no { position:absolute; left:24px; top:60px; width:36px; height:20px; background:#fff; font-size:14px; color:#555; text-align:center; line-height:20px; }
  .card.dup .nm { position:absolute; left:68px; top:174px; width:104px; height:24px; background:#fff; font-size:17px; color:#444; text-align:center; line-height:24px; }
  .card.dup .tg { position:absolute; left:592px; top:22px; }
  .card.dup .trspan { position:absolute; left:192px; top:22px; width:392px; height:28px; }
  .hand { position:absolute; left:calc(100% - 9px); top:46%; z-index:6; pointer-events:none; }
  .sticky.arrow::before { content:'◀'; position:absolute; left:-14px; top:9px; color:#444; font-size:12px; }
  .tagno { display:inline-block; background:#000; color:#fff; border-radius:9999px; padding:0 8px; margin-right:4px; font-size:12.5px; }

  /* ---------- 單一狀態截圖模式（index.html#s3） ---------- */
  body.single { background:#F0F0F0; }
  body.single aside, body.single .page-head, body.single .frame-title, body.single .frame-sub { display:none !important; }
  body.single main { padding:0 !important; overflow:visible !important; }
  body.single .stage { outline:none; }
  body.single .frame:not(.cur) { position:absolute; left:-20000px; top:0; visibility:hidden; }
  body.single .frame { margin:0; }
</style>
</head>
<body>
<main class="p-8">
  <div class="page-head mb-6" style="max-width:1182px">
    <h1 class="text-2xl font-bold border-b-2 border-black inline-block pb-1">搜尋結果頁：履歷狀態「未讀」篩選</h1>
    <p class="text-base text-gray-600 mt-1">沒改到的區塊（篩選區、求職者卡片）用現有畫面轉灰階示意；有改到的地方用虛線框標出，說明貼在旁邊的便利貼。黃色＝規則，橘色虛線＝文件還沒定義、待確認。</p>
  </div>
  <div id="frames"></div>
</main>

<script>
  var TAGS = ['不拘','未讀','已讀','追蹤中','有備註','已通知'];
  var OPS = ['發信通知','追蹤','列印','下載','轉寄'];

  // 篩選區：真實截圖＋重畫的履歷狀態列
  function panel(sel, hlTag){
    var chips = TAGS.map(function(t,i){
      var on = i===sel;
      return '<span class="chip'+(on?' on':'')+(on&&hlTag?' hl':'')+'"'+(on&&hlTag?' data-a="tag"':'')+'>'+(on?'<i class="ck">✓</i>':'')+t+'</span>';
    }).join('');
    return '<div class="panel rel"><div class="pimg"></div><div class="cover22">'+chips+'</div></div>';
  }

  // 多筆操作列；o.hl = 要框起來的部分：'sum' / 'ops' / 'unk'
  function toolbar(o){
    var hl = o.hl || [];
    var has = function(k){ return hl.indexOf(k) >= 0; };
    var sum = o.read
      ? '<span class="s31">共 '+o.N+' 筆履歷，已排除 '+o.M+' 筆已讀</span><span class="lnk"'+(has('link')?' data-a="link"':'')+'>查看＞</span>'
      : '<span class="s31">共 '+o.N+' 筆履歷</span>';
    var left = '<span class="rel'+(has('sum')?' hl':'')+'" data-a="sum">'+sum+'</span>';
    var grp = '<span class="grp rel'+(has('ops')?' hl':'')+(has('unk')?' hl q':'')+'" data-a="ops">'
      + '<span class="t32"><i class="cbx'+(o.checked?' on':'')+'"></i>全選</span>'
      + '<span class="ops">'+OPS.map(function(t){ return '<span class="op '+(o.en?'en':'dis')+'">'+t+'</span>'; }).join('')+'</span></span>';
    return '<div class="tb rel">'+left+grp+'</div>';
  }

  function cards(checked){
    var box = checked ? '<i class="cbx on"></i>' : '';
    return '<div class="card full rel" data-a="card">'+box+'</div><div class="card peek rel">'+box+'</div>';
  }

  // 空畫面
  function empty(kind, top){
    var a = kind==='a';
    return '<div class="empty rel" style="margin-top:'+top+'px"><div class="hl inl" data-a="empty-'+kind+'">'
      + '<div class="et">'+(a?'沒有找到履歷':'本頁履歷皆已讀')+'</div>'
      + '<div class="ed">'+(a?'您設定的條件下，尚無符合條件的求職者。':'請點擊下一頁繼續查看')+'</div>'
      + (a?'<div class="pbtn">重新設定條件</div>':'')
      + '</div></div>';
  }

  function pager(cur, opts){
    opts = opts || {};
    var nums = [1,2,3,4,5].map(function(n){ return '<span class="pg'+(n===cur?' on':'')+'">'+n+'</span>'; }).join('');
    return '<div class="pager rel'+(opts.narrow?' narrow':'')+'" data-a="pager">'
      + '<div class="pgrow"><span class="pg arrow">‹</span>'+nums+'<span class="pg">…</span><span class="pg">12</span><span class="pg arrow">›</span><span class="pgto">到</span><span class="pgin"></span>頁</div>'
      + '<div class="nextbtn" data-a="next">下一頁</div><div class="pgsel"><span>每頁10筆</span><span>⌄</span></div></div>';
  }

  // 便利貼：a=錨點(data-a)、side=right/left/below/above、dx/dy 微調、q=待確認
  var FRAMES = [
    { id:'unread', title:'履歷狀態選「未讀」',
      html: function(){ return panel(1,true)+toolbar({read:true,N:120,M:8,hl:['sum','ops','link']})+cards(false)+pager(1); },
      notes: [
        {a:'tag', side:'right', dx:430, dy:-40, w:250, t:'選「未讀」後，列表只留下未讀履歷；已讀的從本頁隱藏。單選，點了馬上更新列表。'},
        {a:'sum', side:'below', dx:120, dy:30, w:300, t:'多筆修改改成「共 120 筆履歷，已排除 8 筆已讀　查看＞」<ul><li>120＝整份名單的總數，換頁不變</li><li>8＝這一頁被隱藏的已讀筆數，每頁各自計算，換頁會變</li><li>「查看＞」的樣式參考「主動應徵職缺列表」的樣式</li></ul>'},
        {a:'pager', side:'above', dx:40, dy:-4, w:250, t:'換頁時，「未讀」的狀態要保留。'},
        {a:'ops', side:'right', dx:24, dy:-6, w:260, t:'多筆修改變長，全選與多筆操作整組往右移。<br>往下捲動、這一列離開畫面後，多筆操作會改成固定在頁面上方的樣式（不另外畫圖）。'}
      ] },
    { id:'zero', title:'選「未讀」，但這一頁沒有已讀履歷',
      html: function(){ return panel(1)+toolbar({read:true,N:120,M:0,hl:['sum']})+cards(false)+pager(1); },
      notes: [
        {a:'sum', side:'below', dx:120, dy:30, w:290, t:'這一頁沒有已讀時，照樣顯示「已排除 0 筆已讀」，「查看＞」一樣可以點。版面與「選未讀」的情境相同。'}
      ] },
    { id:'allread', title:'選「未讀」，這一頁全部都是已讀（後面還有其他頁）',
      html: function(){ return panel(1)+toolbar({read:true,N:120,M:10,hl:['ops']})+empty('b',40)+'<div style="height:24px"></div>'+pager(3)+'<div style="height:90px"></div>'; },
      notes: [
        {a:'ops', side:'right', dx:24, dy:-6, w:270, t:'全選與多筆操作持續顯示（沒有已讀的履歷時也一樣）。'},
        {a:'empty-b', side:'right', dx:0, dy:40, w:280, t:'這一頁 10 筆全是已讀，全部被隱藏，改顯示這段文字。<b>空畫面裡不放任何按鈕</b>，翻頁用下方照常顯示的分頁。'},
        {a:'next', side:'below', dx:-20, dy:6, w:300, t:'分頁的「下一頁」按鈕照常保留；翻到最後一頁時沒有下一頁按鈕。'},
      ] },
    { id:'reset', title:'點「查看＞」，回到全部履歷',
      html: function(){
        var before = '<div class="before rel"><span class="bl">點擊前</span>'
          +'<span>履歷狀態</span><span class="chip">不拘</span><span class="chip on"><i class="ck">✓</i>未讀</span><span style="color:#999">已讀　追蹤中　有備註　已通知</span>'
          +'<span style="margin-left:auto;color:#000;font-weight:700">共 120 筆履歷，已排除 8 筆已讀 <span class="hl" data-a="link" style="color:#555;font-weight:400;margin-left:8px">查看＞</span></span></div>';
        var flow = '<div class="flow"><span style="font-size:28px;line-height:1">↓</span>點擊後</div>';
        return '<div style="height:8px"></div>'+before+flow+'<div style="height:6px"></div>'+panel(0,true)+toolbar({N:120,hl:['sum']})+cards(false)+pager(1);
      },
      notes: [
        {a:'tag', side:'right', dx:430, dy:-40, w:270, t:'點「查看＞」＝取消「未讀」：履歷狀態回到「不拘」，多筆修改回到「共 120 筆履歷」，已讀履歷重新出現。'},
        {a:'sum', side:'below', dx:120, dy:30, w:290, t:'還原後，其他篩選條件保留，頁數停留在原頁。'}
      ] },
    { id:'compare', title:'兩種空畫面的差別',
      html: function(){
        var bbar = '<div class="tb rel" style="margin:0"><span class="s31">共 120 筆履歷，已排除 10 筆已讀</span><span class="lnk">查看＞</span></div>';
        return '<div class="cmp">'
          +'<div class="col"><div class="cmp-h">沒有搜尋結果</div>'+empty('a',40)+'<div style="height:30px"></div></div>'
          +'<div class="col"><div class="cmp-h">這一頁全部是已讀</div>'+bbar+empty('b',40)+'<div style="height:24px"></div>'+pager(3,{narrow:true})+'</div></div>'
          +'<table class="diff"><tr><th></th><th>沒有搜尋結果</th><th>這一頁全部是已讀</th></tr>'
          +'<tr><td><b>什麼時候出現</b></td><td>篩選、搜尋或職缺配對條件下沒有任何結果</td><td>履歷狀態選「未讀」，這一頁全被隱藏，但名單還有其他頁（含最後一頁整頁已讀）</td></tr>'
          +'<tr><td><b>按鈕</b></td><td>「重新設定條件」（相似履歷搜尋時不顯示）</td><td>沒有任何按鈕</td></tr>'
          +'<tr><td><b>多筆修改</b></td><td>不顯示；篩選區到標題距離 160</td><td>照常顯示</td></tr>'
          +'<tr><td><b>分頁</b></td><td>不顯示</td><td>照常顯示，翻頁靠它</td></tr>'
          +'<tr><td><b>履歷卡片</b></td><td>不顯示</td><td>不顯示</td></tr></table>';
      } }
  ];


  var host = document.getElementById('frames');
  host.innerHTML = FRAMES.map(function(f){
    return '<section class="frame" id="'+f.id+'"><div class="frame-title">'+f.title+'</div>'
      + '<div class="stage" id="'+f.id+'-stage"><div class="screen">'+f.html()+'</div><div class="notes"></div></div></section>';
  }).join('');

  // 便利貼掛在錨點元件裡面，位置用 CSS 相對錨點，不依賴視窗大小
  function placeNotes(){
    FRAMES.forEach(function(f){
      var st = document.getElementById(f.id+'-stage');
      (f.notes||[]).forEach(function(n){
        var anchors = st.querySelectorAll('.screen [data-a="'+n.a+'"]');
        var el = anchors[anchors.length-1]; if(!el) return;
        var d = document.createElement('div'), dx = n.dx||0, dy = n.dy||0, g = 14;
        d.className = 'sticky'+(n.q?' q':'')+(n.arrow?' arrow':''); d.style.width = n.w+'px';
        d.innerHTML = (n.q?'<b class="qh">待確認</b>':'')+n.t;
        if(n.side==='right'){ d.style.left='calc(100% + '+(g+dx)+'px)'; d.style.top=dy+'px'; }
        else if(n.side==='left'){ d.style.right='calc(100% + '+(g-dx)+'px)'; d.style.top=dy+'px'; }
        else if(n.side==='below'){ d.style.left=dx+'px'; d.style.top='calc(100% + '+(g+dy)+'px)'; }
        else if(n.side==='above'){ d.style.left=dx+'px'; d.style.bottom='calc(100% + '+(g-dy)+'px)'; }
        else { d.style.left='calc(50% - '+(n.w/2-dx)+'px)'; d.style.top='calc(50% + '+dy+'px)'; d.style.transform='translateY(-50%)'; }
        el.appendChild(d);
      });
    });
  }
  function setH(){
    var c = document.querySelector('.frame.cur .stage');
    if(c) document.documentElement.setAttribute('data-h', Math.ceil(c.getBoundingClientRect().height));
  }
  placeNotes();
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(setH); }

  // 單一情境截圖模式：index.html#unread
  var h = location.hash.replace('#','');
  if(h){
    document.body.classList.add('single');
    var el = document.getElementById(h);
    if(el){ el.classList.add('cur'); setH(); }
  }
</script>
</body>
