<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Wireframe Site</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d2433; --muted:#5b6475; --line:#d9dce3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --fg:#e8eaf0; --muted:#9aa3b5; --line:#2c3340; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.7 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
  main { max-width:44rem; margin:0 auto; padding:4rem 1rem; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:.25rem 0; }
  code { border:1px solid var(--line); border-radius:4px; padding:.05rem .35rem; }
</style>
</head>
<body>
<main>
  <h1>Wireframe Site</h1>
  <p>這是佔位頁（dummy index），代表 Cloudflare Pages 部署成功。</p>
  <p>線框圖頁面之後放在 <code>wireframe-site/&lt;slug&gt;/index.html</code>。</p>
</main>
</body>
</html>
