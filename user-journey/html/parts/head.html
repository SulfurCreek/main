版型概念：「招募路線圖」——把八個旅程階段畫成一條捷運路線（主線 J→5，6／7 是任何站都能轉乘的支線），
路線上的每一站就是階段篩選器；下方依序是旅程看板、Sitemap／文件、流程圖、附錄。
視覺規格（report-generator 設計描述五層面＋award-grade checklist）
字體：Noto Sans TC（中文內文與標題）＋Archivo（站碼、英文標籤，用 wdth 軸做寬體）＋IBM Plex Mono（頁面數、檔名、資料）；皆有系統字體 fallback，離線照常可讀。
級距：hero 標題 clamp(2.2rem,4.6vw,4rem)／段標 1.5rem／看板內文 0.84rem／標籤 0.7rem；8px 基準間距。
配色：鈷藍＝主線與互動；琥珀＝支線（6／7 支援）與 US*；綠＝機會點；中性灰帶藍偏色。暗色版另調、不是反相。
動態：載入時路線由左往右畫出一次（0.9s），選站時站點脈衝；prefers-reduced-motion 全部關閉。
