<title>求才端 User Journey Map</title>
<!--
版型：User Journey Map 看板（user-journey-map skill 三段式：Context／Journey Grid／Key Takeaways＋附錄文件庫）。
視覺規格（report-generator 設計描述五層面）
字體：系統字體堆疊（PingFang TC / Microsoft JhengHei），標題 700、內文 400，數字 tabular-nums。
級距：h1 1.7rem／段標 1.2rem／看板內文 0.84rem／來源與標籤 0.72rem；行高 1.55；Emotions 表情 1.5rem。
留白：外框 max 1180px、側邊 16px；看板欄寬 250px、列標欄 132px 固定；區塊間距 48px；卡片內距 14px。
配色：墨藍文字＋冷灰底兩階；階段頭單一藍色系；痛點列淡紅、機會點列淡綠（語意色）；US 藍、US* 琥珀、推論 紫灰虛線、NULL 灰虛線。
動態：無進場動畫；僅 hover 高亮同一階段欄與文件庫篩選。
借用層面：看板＝傳統 journey map「階段在欄、泳道在列」，分表帶沿用素材的表 A／B／C 分組；不借外部版型原始碼、無外部資源。
-->
<style>
  :root {
    --bg:#f7f8fa; --paper:#ffffff; --band:#eef1f6; --line:#dde2ea;
    --ink:#18202e; --ink-2:#4a5466; --ink-3:#7c8596;
    --phase:#2d5bb8; --phase-soft:#e3ebfa; --phase-ink:#ffffff;
    --pain:#fbeceb; --pain-ink:#b0342c; --opp:#e8f5ec; --opp-ink:#207144;
    --us:#2d5bb8; --usx:#d99400; --usx-ink:#1d1a10; --inf:#6b5fa6; --quote:#f1f3f8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12151b; --paper:#1a1f28; --band:#212733; --line:#2f3746;
      --ink:#eef1f6; --ink-2:#b6bdcb; --ink-3:#848d9e;
      --phase:#5f8ee8; --phase-soft:#243352; --phase-ink:#0d1220;
      --pain:#3a2225; --pain-ink:#f19088; --opp:#1c3326; --opp-ink:#7fd3a0;
      --us:#5f8ee8; --usx:#e0a526; --usx-ink:#1d1a10; --inf:#b3a8ee; --quote:#232a38;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#12151b; --paper:#1a1f28; --band:#212733; --line:#2f3746;
    --ink:#eef1f6; --ink-2:#b6bdcb; --ink-3:#848d9e;
    --phase:#5f8ee8; --phase-soft:#243352; --phase-ink:#0d1220;
    --pain:#3a2225; --pain-ink:#f19088; --opp:#1c3326; --opp-ink:#7fd3a0;
    --us:#5f8ee8; --usx:#e0a526; --usx-ink:#1d1a10; --inf:#b3a8ee; --quote:#232a38;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height:1.55; font-size:0.92rem; font-variant-numeric:tabular-nums; }
  .wrap { max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:28px 80px; }
  a { color:var(--phase); text-decoration:none; } a:hover { text-decoration:underline; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--phase); outline-offset:2px; }
  code { background:var(--band); padding:1px 5px; border-radius:4px; font-size:0.85em; }

  header.top { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .eyebrow { font-size:0.72rem; letter-spacing:0.08em; color:var(--ink-3); text-transform:uppercase; }
  h1 { font-size:1.7rem; margin:0; text-wrap:balance; }
  .src { font-size:0.78rem; color:var(--ink-3); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:0.78rem; color:var(--ink-2); margin-top:8px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .about { font-size:0.8rem; color:var(--ink-2); margin-top:4px; }
  .about summary { cursor:pointer; color:var(--ink-3); }
  .about ul { margin:6px 0 0; padding-left:1.2em; }

  section.part { margin-top:44px; }
  .part-hd { margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .part-hd h2 { font-size:1.2rem; margin:0; text-wrap:balance; }
  .hint { font-size:0.78rem; color:var(--ink-3); margin:0 2px 10px; }

  /* ---------- Context ---------- */
  .ctx { display:grid; grid-template-columns:1.4fr 1fr; gap:14px; align-items:start; }
  @media (max-width:760px) { .ctx { grid-template-columns:1fr; } }
  .ctx-stack { display:grid; gap:14px; }
  .ctx-card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; }
  .ctx-card .k { font-size:0.72rem; letter-spacing:0.06em; color:var(--ink-3); text-transform:uppercase; }
  .ctx-card .t { font-weight:700; margin:3px 0 8px; font-size:1rem; }
  .ctx-stack .ctx-card .t { font-weight:500; }
  .ctx-card .facet { display:grid; gap:2px; margin-top:10px; font-size:0.86rem; }
  .ctx-card .facet b { color:var(--ink-2); font-size:0.78rem; }

  /* ---------- Journey board ---------- */
  .board-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--paper); }
  .board { display:grid; grid-template-columns:132px repeat(var(--n), minmax(250px, 1fr)); min-width:calc(132px + var(--n) * 250px); font-size:0.84rem; }
  .board > div { padding:10px 12px; border-bottom:1px solid var(--line); border-left:1px solid var(--line); min-width:0; }
  .board .rl { position:sticky; left:0; z-index:2; background:var(--band); border-left:none; font-weight:700; color:var(--ink-2); font-size:0.8rem; }
  .board .rl small { display:block; font-weight:400; color:var(--ink-3); font-size:0.72rem; }
  .board .last { border-bottom:none; }

  .grp { background:var(--band); font-size:0.74rem; color:var(--ink-3); padding-block:5px !important; letter-spacing:0.02em; }
  .ph { background:var(--phase-soft); position:relative; }
  .ph .code { display:inline-block; min-width:26px; text-align:center; font-weight:800; background:var(--phase); color:var(--phase-ink); border-radius:6px; padding:1px 7px; margin-right:6px; }
  .ph .nm { font-weight:700; }
  .ph .nm small { display:block; font-weight:400; color:var(--ink-2); font-size:0.74rem; margin-top:4px; }
  .ph.support { background:repeating-linear-gradient(135deg, var(--phase-soft) 0 8px, var(--band) 8px 16px); }
  .ph .arw { position:absolute; right:-9px; top:50%; transform:translateY(-50%); z-index:1; width:16px; height:16px; background:var(--phase); color:var(--phase-ink); border-radius:50%; font-size:10px; line-height:16px; text-align:center; }

  .steps { margin:0; padding-left:1.25em; } .steps li { margin-bottom:3px; }
  .cite { margin-top:7px; font-size:0.72rem; color:var(--ink-3); line-height:1.5; }
  .cite a { color:var(--ink-3); text-decoration:underline; text-decoration-color:var(--line); }
  .cite a:hover { color:var(--phase); }
  .q { display:block; background:var(--quote); border-radius:10px 10px 10px 2px; padding:6px 9px; font-weight:600; margin:4px 0 2px; }
  .emo { font-size:1.5rem; line-height:1.2; display:block; }
  .emo-w { font-weight:700; } .emo-w .mk { margin-left:5px; }
  .r-pain { background:var(--pain); } .board .r-pain.rl { background:var(--band); color:var(--pain-ink); }
  .r-opp { background:var(--opp); } .board .r-opp.rl { background:var(--band); color:var(--opp-ink); }
  .col-hover { box-shadow:inset 0 0 0 2px var(--phase-soft); }

  .mk { display:inline-block; font-size:0.66rem; font-weight:700; line-height:1; padding:3px 5px; border-radius:4px; margin-right:3px; vertical-align:1px; white-space:nowrap; }
  .mk.us { background:var(--us); color:var(--paper); }
  .mk.usx { background:var(--usx); color:var(--usx-ink); }
  .mk.inf { color:var(--inf); border:1px dashed var(--inf); }
  .mk.null { color:var(--ink-3); border:1px dashed var(--ink-3); }

  /* ---------- Takeaways ---------- */
  .tk { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; align-items:stretch; }
  @media (max-width:640px) { .tk { grid-template-columns:1fr; } }
  .tk-card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0; }
  .tk-card h3 { margin:0; font-size:1rem; }
  .tk-card .sub { font-size:0.74rem; color:var(--ink-3); margin-bottom:8px; }
  .tk-card.risk { border-top:3px solid var(--pain-ink); }
  .tk-card.aha { border-top:3px solid var(--opp-ink); }
  .tk-card.next { border-top:3px solid var(--phase); grid-column:1 / -1; }
  .tk-card ol { margin:0; padding-left:1.3em; } .tk-card li { margin-bottom:7px; }

  /* ---------- Appendix ---------- */
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 10px; }
  .filters button { font:inherit; font-size:0.78rem; padding:3px 11px; border:1px solid var(--line); border-radius:20px; background:var(--paper); color:var(--ink-2); cursor:pointer; }
  .filters button.on { background:var(--phase); border-color:var(--phase); color:var(--phase-ink); }
  .tw { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:0.84rem; background:var(--paper); }
  th, td { padding:7px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--ink-2); font-size:0.76rem; white-space:nowrap; background:var(--band); }
  td.k { font-weight:600; white-space:nowrap; }
  .ids a { display:inline-block; margin:0 8px 2px 0; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:0.78rem; }
  .none { color:var(--ink-3); }
  h3.ap { font-size:0.95rem; margin:18px 0 8px; }
  .shared { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:4px 16px; font-size:0.84rem; }
  .list { padding-left:1.2em; margin:6px 0; font-size:0.86rem; } .list li { margin-bottom:6px; }

  .theme-toggle { position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); right:12px; z-index:9; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:5px 11px; font:inherit; font-size:0.75rem; cursor:pointer; color:var(--ink-2); }
</style>

<button class="theme-toggle" id="theme-toggle" type="button">深淺色</button>

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const BASE = 'https://hackmd.io/@1111-jobdocs/';
const MK = /〔推論〕|(?<![A-Za-z])(?:US\*|US(?![A-Za-z])|NULL)/g;
const marks = t => t.replace(MK, m => m === '〔推論〕' ? '<span class="mk inf">推論</span>' : m === 'US*' ? '<span class="mk usx">US*</span>' : m === 'US' ? '<span class="mk us">US</span>' : '<span class="mk null">NULL</span>');
function md(raw) {
  const s = esc(String(raw).replace(/\\\*/g, '*')), out = []; let last = 0, m; const rx = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
  const seg = t => marks(t.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'));
  while ((m = rx.exec(s))) { out.push(seg(s.slice(last, m.index))); out.push('<a href="' + m[2] + '" target="_blank" rel="noopener">' + m[1] + '</a>'); last = rx.lastIndex; }
  out.push(seg(s.slice(last))); return out.join('');
}

function cellHtml(raw, lane) {
  const t = raw.trim();
  if (/^NULL$/.test(t)) return '<span class="mk null">NULL</span>';
  const parts = t.split(/<br\s*\/?>/i);
  let main = parts.shift(), extra = [], cites = [];
  parts.forEach(p => (isLinkLine(p) ? cites : extra).push(p));
  // 「依據」拆到來源行（Thoughts／Emotions／Metrics 的推論依據）
  const bm = main.match(/^(.*?)[；;]?\s*(依據[：:同].*)$/);
  if (bm && bm[1].trim()) { main = bm[1]; cites.unshift(bm[2]); }
  let body;
  if (lane === 'User Actions') body = '<ol class="steps">' + main.split(/\s*→\s*/).map(s => '<li>' + md(s) + '</li>').join('') + '</ol>';
  else if (lane === 'Emotions') { const em = main.match(/^(\p{Extended_Pictographic}️?)\s*(.*)$/u);
    body = em ? '<span class="emo" aria-hidden="true">' + em[1] + '</span><span class="emo-w">' + md(em[2]) + '</span>' : md(main); }
  else if (lane === 'Thoughts') body = md(main).replace(/「([^」]+)」/g, '<span class="q">「$1」</span>');
  else body = md(main);
  body += extra.map(p => '<div style="margin-top:4px">' + md(p) + '</div>').join('');
  return body + (cites.length ? '<div class="cite">' + cites.map(md).join('<br>') + '</div>' : '');
}

  document.getElementById('doc-table').innerHTML = '<thead><tr><th>階段</th><th>功能</th><th>文件（shortId → HackMD）</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td class="k">' + esc(r.stage) + '</td><td class="k">' + esc(r.func) + '</td><td class="ids">' +
      r.docs.map(d => { const m = d.match(/^([A-Za-z0-9_-]+)(（.*）)?$/); return m ? idLink(m[1]) + (m[2] ? '<span class="none">' + esc(m[2]) + '</span> ' : '') : esc(d); }).join('') + '</td></tr>').join('') + '</tbody>';
}
renderDocs();
document.getElementById('shared').innerHTML = A.shared.split(/[、，,]/).map(s => { const m = s.trim().match(/^(.*?)\s*([A-Za-z0-9_-]{9,10}(?:／[A-Za-z0-9_-]{9,10})*)$/);
  return m ? '<div>' + esc(m[1]) + '：<span class="ids">' + m[2].split('／').map(idLink).join('') + '</span></div>' : '<div>' + esc(s.trim()) + '</div>'; }).join('');
document.getElementById('gap-h').textContent = A.gap_heading;
document.getElementById('gap-list').innerHTML = A.gaps.map(g => '<li>' + md(g) + '</li>').join('');
</script>

</body>
</html>
