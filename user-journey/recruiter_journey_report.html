<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>求才端 User Journey Map</title>
<!--
版型概念：「招募路線圖」——把八個旅程階段畫成一條捷運路線（主線 J→5，6／7 是任何站都能轉乘的支線），
路線上的每一站就是階段篩選器；下方依序是旅程看板、Sitemap／文件、流程圖、附錄。
視覺規格（report-generator 設計描述五層面＋award-grade checklist）
字體：Noto Sans TC（中文內文與標題）＋Archivo（站碼、英文標籤，用 wdth 軸做寬體）＋IBM Plex Mono（頁面數、檔名、資料）；皆有系統字體 fallback，離線照常可讀。
級距：hero 標題 clamp(2.2rem,4.6vw,4rem)／段標 1.5rem／看板內文 0.84rem／標籤 0.7rem；8px 基準間距。
配色：鈷藍＝主線與互動；琥珀＝支線（6／7 支援）與 US*；綠＝機會點；中性灰帶藍偏色。暗色版另調、不是反相。
動態：載入時路線由左往右畫出一次（0.9s），選站時站點脈衝；prefers-reduced-motion 全部關閉。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
  /* Layout：hero 路線圖（篩選）→ 情境＋閱讀指南 → 旅程看板 → Sitemap｜文件 → 流程圖 → 附錄 */
  :root {
    --bg:#f1f3f6; --surface:#ffffff; --surface-2:#e7ebf1; --rule:#d3d9e2;
    --ink:#0d1626; --ink-2:#435066; --ink-3:#768296;
    --line:#2343d6; --line-soft:#e3e9fd; --line-ink:#ffffff;
    --spur:#c8741f; --spur-soft:#fbefe0;
    --opp:#e6f4eb; --opp-ink:#1b6a3d;
    --us:#2343d6; --usx:#d99a16; --usx-ink:#1f1806; --inf:#6a5bb0;
    --canvas:#ffffff;
    --f-cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --f-disp:"Archivo","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    --r:10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0a0f18; --surface:#111826; --surface-2:#182133; --rule:#253046;
      --ink:#e9eef6; --ink-2:#a7b2c5; --ink-3:#717d93;
      --line:#7390ff; --line-soft:#1a2550; --line-ink:#0a0f18;
      --spur:#f2a24e; --spur-soft:#35260f;
      --opp:#122b1d; --opp-ink:#83d9a4;
      --us:#7390ff; --usx:#e8ad35; --usx-ink:#1f1806; --inf:#b4a9f2;
      --canvas:#f6f7f9;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0a0f18; --surface:#111826; --surface-2:#182133; --rule:#253046;
    --ink:#e9eef6; --ink-2:#a7b2c5; --ink-3:#717d93;
    --line:#7390ff; --line-soft:#1a2550; --line-ink:#0a0f18;
    --spur:#f2a24e; --spur-soft:#35260f;
    --opp:#122b1d; --opp-ink:#83d9a4;
    --us:#7390ff; --usx:#e8ad35; --usx-ink:#1f1806; --inf:#b4a9f2;
    --canvas:#f6f7f9;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:72px; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-cjk);
    font-size:0.92rem; line-height:1.6; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1760px; margin:0 auto; padding-inline:clamp(16px, 1.6vw, 40px); padding-block:0 96px; }
  a { color:var(--line); text-decoration:none; } a:hover { text-decoration:underline; text-underline-offset:3px; }
  :focus-visible { outline:2px solid var(--line); outline-offset:2px; border-radius:4px; }
  code { font-family:var(--f-mono); font-size:0.82em; background:var(--surface-2); padding:1px 5px; border-radius:4px; }
  h1, h2, h3 { text-wrap:balance; }
  .eyebrow { font-family:var(--f-disp); font-stretch:112%; font-weight:600; font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }

  /* ---------- Hero ---------- */
  .hero { padding-block:56px 8px; display:grid; gap:18px; }
  .hero-top { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px; align-items:flex-end; }
  h1 { margin:0; font-weight:900; font-size:clamp(2.2rem, 4.6vw, 4rem); line-height:1.04; letter-spacing:-0.01em; }
  h1 .en { display:block; font-family:var(--f-disp); font-stretch:125%; font-weight:800; color:var(--line); letter-spacing:-0.02em; }
  h1 .who { font-size:0.42em; font-weight:500; color:var(--ink-2); margin-left:0.3em; letter-spacing:0; vertical-align:0.35em; }
  .hero-body { display:grid; grid-template-columns:minmax(0,1fr); gap:18px 48px; align-items:end; }
  @media (min-width:1100px) { .hero-body { grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); } }
  .hero-side { display:grid; gap:14px; min-width:0; }
  .lead { max-width:68ch; color:var(--ink-2); font-size:0.98rem; margin:0; }
  .meta { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:0.74rem; color:var(--ink-3); }
  .meta b { font-weight:500; color:var(--ink-2); }
  .meta details summary { cursor:pointer; }
  .meta details[open] ul { margin:8px 0 0; padding-left:1.2em; max-width:90ch; }

  /* ---------- Route map (stage filter) ---------- */
  .route { position:relative; margin-top:20px; background:var(--surface); border:1px solid var(--rule); border-radius:18px; padding:22px clamp(14px, 2vw, 28px) 18px; }
  .route-hd { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; margin-bottom:14px; }
  .route-hd p { margin:0; font-size:0.78rem; color:var(--ink-3); }
  .all-btn { font:inherit; font-size:0.78rem; font-weight:700; padding:6px 14px; border-radius:999px; border:1.5px solid var(--line); background:transparent; color:var(--line); cursor:pointer; }
  .all-btn[aria-pressed="true"] { background:var(--line); color:var(--line-ink); }
  .main-line { position:relative; display:grid; grid-template-columns:repeat(var(--m), minmax(0,1fr)); gap:10px; }
  .main-line::before { content:""; position:absolute; left:calc(50% / var(--m)); right:calc(50% / var(--m)); top:21px; height:6px; border-radius:3px; background:var(--line);
    transform-origin:left center; animation:draw 0.9s cubic-bezier(.6,.1,.2,1) both; }
  @keyframes draw { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .stn { position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; font:inherit; color:inherit; background:none; border:0; padding:0 4px 10px; cursor:pointer; border-radius:12px; min-width:0; }
  .stn .dot { width:48px; height:48px; border-radius:50%; background:var(--surface); border:6px solid var(--line); display:grid; place-items:center;
    font-family:var(--f-disp); font-stretch:100%; font-weight:800; font-size:1rem; color:var(--ink); transition:transform .18s, background .18s, color .18s; position:relative; z-index:1; }
  .stn .nm { font-weight:700; font-size:0.98rem; line-height:1.25; }
  .stn .ver { font-size:0.68rem; font-weight:500; color:var(--ink-3); border:1px solid var(--rule); border-radius:999px; padding:0 8px; }
  .stn .does { font-size:0.74rem; color:var(--ink-2); line-height:1.5; max-width:100%; text-wrap:pretty; }
  .stn .nums { font-family:var(--f-mono); font-size:0.66rem; color:var(--ink-3); display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .stn .nums b { color:var(--ink); font-weight:500; }
  .stn:hover .dot { transform:scale(1.08); }
  .stn[aria-pressed="true"] .dot { background:var(--line); color:var(--line-ink); animation:pulse 1.4s ease-out 1; }
  .stn[aria-pressed="true"] { background:var(--line-soft); }
  .route.has-sel .stn[aria-pressed="false"] { opacity:0.45; }
  .route.has-sel .stn[aria-pressed="false"]:hover { opacity:0.8; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--line) 55%, transparent); } 100% { box-shadow:0 0 0 18px transparent; } }
  .spur { position:relative; margin-top:14px; padding-top:16px; border-top:2px dashed var(--spur); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .spur .stn { flex-direction:row; text-align:left; align-items:center; gap:12px; padding:6px 12px 6px 6px; }
  .spur .stn .dot { border-color:var(--spur); width:48px; height:48px; font-size:0.7rem; letter-spacing:-0.04em; }
  .spur .stn[aria-pressed="true"] .dot { background:var(--spur); color:var(--line-ink); }
  .spur .stn[aria-pressed="true"] { background:var(--spur-soft); }
  .spur .stn .txt { display:grid; gap:2px; justify-items:start; }
  .spur .stn .does { max-width:none; }
  .spur-tag { font-family:var(--f-disp); font-stretch:112%; font-size:0.66rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--spur); }

  /* 捲動後的迷你路線列 */
  .minirail { position:fixed; top:0; left:0; right:0; z-index:20; padding:calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
    background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--rule);
    display:flex; gap:6px; align-items:center; overflow-x:auto; scrollbar-width:none; transform:translateY(-110%); transition:transform .22s; }
  .minirail.show { transform:none; }
  .minirail .lb { font-family:var(--f-disp); font-stretch:112%; font-size:0.66rem; font-weight:700; letter-spacing:0.12em; color:var(--ink-3); margin-right:6px; white-space:nowrap; }
  .minirail button { flex:none; font:inherit; font-size:0.76rem; padding:4px 11px 4px 4px; border-radius:999px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-2); cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  .minirail button i { font-style:normal; font-family:var(--f-disp); font-weight:800; font-size:0.7rem; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; border:3px solid var(--line); color:var(--ink); }
  .minirail button.sp i { border-color:var(--spur); }
  .minirail button[aria-pressed="true"] { background:var(--line); border-color:var(--line); color:var(--line-ink); }
  .minirail button[aria-pressed="true"] i { background:var(--line-ink); color:var(--line); border-color:var(--line-ink); }
  .minirail button.all { padding:4px 12px; }
  .theme-toggle { margin-left:auto; flex:none; font:inherit; font-size:0.72rem; padding:5px 12px; border-radius:999px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-2); cursor:pointer; }
  .hero .theme-toggle { margin-left:0; }

  /* ---------- Sections ---------- */
  section.part { margin-top:72px; }
  .sec-hd { display:grid; gap:4px; margin-bottom:18px; }
  .sec-hd h2 { margin:0; font-size:1.5rem; font-weight:900; letter-spacing:-0.005em; }
  .sec-hd p { margin:0; color:var(--ink-3); font-size:0.8rem; max-width:90ch; }
  .sec-hd .sel-tag { display:inline-flex; gap:6px; align-items:center; font-size:0.74rem; font-weight:700; color:var(--line); }
  .sec-hd .sel-tag[hidden] { display:none; }

  /* ---------- Context + guide ---------- */
  .ctx { display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
  @media (min-width:1024px) { .ctx { grid-template-columns:minmax(0,7fr) minmax(0,5fr); } }
  .persona { background:var(--surface); border:1px solid var(--rule); border-radius:18px; padding:24px 26px; display:grid; gap:18px; }
  .persona .who { font-size:1.35rem; font-weight:900; line-height:1.35; margin:6px 0 0; }
  .persona .row { display:grid; grid-template-columns:minmax(0,1fr); gap:18px; padding-top:18px; border-top:1px solid var(--rule); }
  @media (min-width:720px) { .persona .row { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  .persona .k { margin-bottom:4px; }
  .persona .v { font-size:0.88rem; color:var(--ink-2); }
  .persona .v p { margin:0 0 6px; }
  .guide { background:var(--surface-2); border-radius:18px; padding:22px 24px; display:grid; gap:14px; align-content:start; min-width:0; }
  .guide p { margin:0; font-size:0.84rem; color:var(--ink-2); }
  .legend { display:grid; gap:7px; font-size:0.82rem; color:var(--ink-2); }
  .legend div { display:grid; grid-template-columns:62px 1fr; align-items:center; gap:8px; }
  .ctx { align-items:start; }
  .gloss { margin-top:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:10px 32px; }
  @media (min-width:1024px) { .gloss { grid-template-columns:150px minmax(0,1fr); } }
  .gloss-hd h3 { margin:2px 0 0; font-size:1.05rem; font-weight:900; }
  .terms { margin:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 380px), 1fr)); column-gap:32px; font-size:0.8rem; border-top:1px solid var(--rule); }
  .terms div { display:grid; grid-template-columns:minmax(84px, 8.5em) minmax(0,1fr); gap:10px; padding:9px 0; border-bottom:1px solid var(--rule); }
  .terms dt { font-weight:700; } .terms dd { margin:0; color:var(--ink-2); }
  .terms dd .src { color:var(--ink-3); font-size:0.72rem; margin-left:4px; }

  /* ---------- Journey board ---------- */
  .board-wrap { overflow-x:auto; border:1px solid var(--rule); border-radius:18px; background:var(--surface); }
  .board { display:grid; grid-template-columns:112px repeat(var(--n), minmax(160px, 1fr)); min-width:calc(112px + var(--n) * 160px); font-size:0.84rem; }
  .board > div { overflow-wrap:anywhere; padding:12px 14px; border-bottom:1px solid var(--rule); border-left:1px solid var(--rule); min-width:0; transition:opacity .2s, background .2s; }
  .board .rl { position:sticky; left:0; z-index:2; background:var(--surface); border-left:none; box-shadow:1px 0 0 var(--rule); }
  .board .rl .en { font-family:var(--f-disp); font-stretch:88%; font-weight:700; font-size:0.7rem; letter-spacing:0.05em; overflow-wrap:normal; word-break:keep-all; text-transform:uppercase; color:var(--ink); display:block; }
  .board .rl small { display:block; color:var(--ink-3); font-size:0.74rem; }
  .board .last { border-bottom:none; }
  .grp { font-family:var(--f-mono); font-size:0.68rem; color:var(--ink-3); padding-block:6px !important; background:var(--surface-2); }
  .board .rl.grp { background:var(--surface-2); }
  .ph { position:relative; cursor:pointer; display:flex; gap:10px; align-items:center; background:var(--surface); }
  .ph .code { flex:none; width:34px; height:34px; border-radius:50%; border:4px solid var(--line); display:grid; place-items:center; font-family:var(--f-disp); font-weight:800; font-size:0.78rem; }
  .ph.support .code { border-color:var(--spur); font-size:0.54rem; letter-spacing:-0.04em; }
  .ph .nm { font-weight:700; font-size:0.92rem; line-height:1.3; }
  .ph .nm small { display:block; font-weight:400; color:var(--ink-3); font-size:0.7rem; margin-top:2px; }
  .ph.support { background:repeating-linear-gradient(135deg, var(--surface) 0 9px, var(--spur-soft) 9px 18px); }
  .steps { margin:0; padding-left:1.2em; } .steps li { margin-bottom:4px; } .steps li::marker { color:var(--line); font-weight:700; font-family:var(--f-disp); }
  .cite { margin-top:8px; font-size:0.72rem; color:var(--ink-3); line-height:1.55; }
  .cite a { color:var(--ink-3); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:2px; }
  .cite a:hover { color:var(--line); text-decoration-color:currentColor; }
  .q { display:block; background:var(--surface-2); border-radius:12px 12px 12px 3px; padding:7px 10px; font-weight:500; margin:2px 0; }
  .emo { font-size:1.6rem; line-height:1.15; display:block; }
  .emo-w { font-weight:700; } .emo-w .mk { margin-left:5px; }
  .r-opp { background:var(--opp); } .board .r-opp.rl { background:var(--surface); } .board .r-opp.rl .en { color:var(--opp-ink); }
  .board [data-col].dim { opacity:0.28; filter:grayscale(1); pointer-events:none; user-select:none; }
  .board [data-col].sel { background-color:color-mix(in srgb, var(--line-soft) 55%, transparent); }
  .board .ph.sel { box-shadow:inset 0 3px 0 var(--line); }
  .board .ph.support.sel { box-shadow:inset 0 3px 0 var(--spur); }
  .board .col-hover:not(.dim) { background-color:color-mix(in srgb, var(--line-soft) 40%, transparent); }
  .board-note { margin:10px 2px 0; font-size:0.74rem; color:var(--ink-3); }
  .tp { display:flex; flex-wrap:wrap; gap:4px; }
  .tp a, .tp span { font-size:0.74rem; line-height:1.3; padding:3px 8px; border-radius:999px; border:1px solid var(--rule); background:var(--surface); color:var(--ink-2); }
  .tp a { color:var(--line); border-color:color-mix(in srgb, var(--line) 50%, var(--rule)); }
  .tp a::after { content:" ↓"; font-size:0.9em; } .tp a:hover { background:var(--line-soft); text-decoration:none; }
  .tp-plain { margin:0; font-size:0.78rem; color:var(--ink-2); line-height:1.7; } .tp-plain i { font-style:normal; color:var(--ink-3); }
  .tp-mail { margin-top:8px; font-size:0.72rem; color:var(--ink-3); }

  .mk { display:inline-block; font-family:var(--f-disp); font-stretch:100%; font-size:0.64rem; font-weight:800; line-height:1; padding:3px 5px; border-radius:4px; margin-right:3px; vertical-align:1px; white-space:nowrap; letter-spacing:0.02em; }
  .mk.us { background:var(--us); color:var(--line-ink); }
  .mk.usx { background:var(--usx); color:var(--usx-ink); }
  .mk.inf { color:var(--inf); border:1px dashed var(--inf); font-family:var(--f-cjk); font-weight:700; }
  .mk.null { color:var(--ink-3); border:1px dashed var(--ink-3); }
  .mk.tag { color:var(--ink-2); border:1px solid var(--rule); background:var(--surface-2); font-family:var(--f-cjk); font-weight:700; }

  /* ---------- Sitemap | docs ---------- */
  .sm-row { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; align-items:start; }
  @media (min-width:1024px) { .sm-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  .panel { background:var(--surface); border:1px solid var(--rule); border-radius:18px; min-width:0; overflow:hidden; }
  .panel-hd { padding:16px 20px 12px; border-bottom:1px solid var(--rule); display:grid; gap:2px; }
  .panel-hd h3 { margin:0; font-size:1.05rem; font-weight:900; }
  .panel-hd p { margin:0; font-size:0.74rem; color:var(--ink-3); }
  .sm-scroll { max-height:min(72vh, 760px); overflow:auto; padding:6px 20px 18px; }
  .sm-mods { columns:2 260px; column-gap:28px; }
  .sm-mod { break-inside:avoid; padding:14px 0 6px; transition:opacity .2s; }
  .sm-mod.dim { opacity:0.3; }
  .sm-mod h4 { margin:0 0 6px; font-size:0.84rem; font-weight:900; display:flex; gap:8px; align-items:center; }
  .sm-mod h4 .n { flex:none; width:22px; height:22px; border-radius:50%; border:3px solid var(--ink-3); display:grid; place-items:center; font-family:var(--f-disp); font-size:0.66rem; font-weight:800; }
  .sm-mod.lit h4 .n { border-color:var(--line); background:var(--line); color:var(--line-ink); }
  .sm-mod.lit h4 { color:var(--line); }
  .sm-list { border-left:2px solid var(--rule); margin-left:10px; padding-left:0; }
  .sm-mod.lit .sm-list { border-left-color:var(--line); }
  .sm-node { position:relative; font-size:0.82rem; line-height:1.55; padding:2px 8px 2px 14px; border-radius:6px; transition:background .3s; }
  .sm-node::before { content:""; position:absolute; left:0; top:0.85em; width:9px; border-top:2px solid var(--rule); }
  .sm-mod.lit .sm-node::before { border-top-color:var(--line); }
  .sm-node.grp { font-weight:700; color:var(--ink-2); font-size:0.76rem; margin-top:4px; }
  .sm-node.flash { background:var(--usx); color:var(--usx-ink); }
  .sm-node .mk { margin-left:6px; }
  .tw { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:0.84rem; }
  th, td { padding:9px 14px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:top; }

    (f.link ? '<a href="' + esc(f.link) + '" target="_blank" rel="noopener">' + esc(f.doc_title) + '</a>' : esc(f.doc_title)) + '</div>' +
    (f.svgs.length ? f.svgs.map(v => '<div class="flow-canvas" role="img" aria-label="' + esc(f.name) + '">' + v + '</div>').join('') : '<div class="blank" style="min-height:120px"><div>留白，內容待補</div></div>') + '</article>').join('');
  document.querySelectorAll('.flow-canvas').forEach(c => c.setAttribute('tabindex', '0'));
}

// ---------- Sitemap ＋ 文件 ----------
const A = DATA.appendix;
$('ap-h').textContent = '對應文件';
$('lib-note').textContent = '依 HackMD Sitemap 對齊，只列文件名稱，點了開 HackMD。';
$('sm-note').textContent = '來源：HackMD Sitemap。預設顯示全部模組；選了階段，對應模組亮起。';
function renderSitemap() {
  const on = new Set(sel === null ? [] : modsOf(ST[sel].code).map(m => m.no));
  $('sm-tree').innerHTML = LIB.modules.map(m => {
    const cls = sel === null ? '' : on.has(m.no) ? ' lit' : ' dim';
    return '<div class="sm-mod' + cls + '"><h4><span class="n">' + esc(m.no) + '</span>' + esc(m.name) + '</h4>' + (m.tree.length ? '<div class="sm-list">' + m.tree.map((nd, k) =>
      '<div class="sm-node' + (nd.group ? ' grp' : '') + '" id="sm-' + m.no + '-' + k + '" style="margin-left:' + Math.max(0, nd.depth - 1) * 14 + 'px">' + esc(nd.name) +
      (nd.tag ? '<span class="mk usx">' + esc(nd.tag) + '</span>' : '') + '</div>').join('') + '</div>' : '<span class="none">Sitemap 無頁面</span>') + '</div>'; }).join('');
  if (sel !== null) { const first = document.querySelector('.sm-mod.lit'); if (first) $('sm-scroll').scrollTo({ top: first.offsetTop - 12 }); }
}
const stageName = code => { const st = ST.find(x => x.code === code || (code === '6／7' && x.code === '6')); return st ? dispCode(st) + ' ' + (introRow(st) ? introRow(st)[1] : stageLabel(st).name) : code; };
function renderDocs() {
  const mods = LIB.modules.filter(m => sel === null || modsOf(ST[sel].code).includes(m));
  $('doc-table').innerHTML = '<thead><tr><th>階段</th><th>Sitemap 模組</th><th>文件</th></tr></thead><tbody>' +
    mods.map(m => '<tr><td class="k">' + esc(stageName(m.stage)) + '</td><td class="k">' + esc(m.no + ' ' + m.name.replace(/（.*）/, '')) + '</td><td>' +
      (m.docs.length ? '<ul class="libdocs">' + m.docs.map(d => '<li><a href="' + BASE + d.shortId + '" target="_blank" rel="noopener">' + esc(d.title) + '</a></li>').join('') + '</ul>' : '<span class="none">Sitemap 未掛文件</span>') +
      '</td></tr>').join('') + '</tbody>';
}

// ---------- 附錄 ----------
$('shared').innerHTML = LIB.shared.map(d => '<a href="' + BASE + d.shortId + '" target="_blank" rel="noopener">' + esc(d.title) + '</a>').join('');
$('gap-h').textContent = A.gap_heading;
$('gap-list').innerHTML = A.gaps.map(g => '<li>' + md(g) + '</li>').join('');
$('todo-h').textContent = DATA.todo.heading;
$('todo-list').innerHTML = DATA.todo.items.map(i => '<li>' + md(i.text) + (i.children.length ? '<ul class="list">' + i.children.map(c => '<li>' + md(c) + '</li>').join('') + '</ul>' : '') + '</li>').join('');
$('foot').innerHTML = '<span>素材由文件助手維護：<code>user-journey/recruiter_journey_map.md</code></span><span>建置：<code>html/step0 → step1 → step2</code></span><span>' + md(C.marker_note.replace(/^標記：/, '標記規則：')).slice(0, 0) + '</span>';

setSel(null);
</script>
