    AnalyzeMetadata:
      additionalProperties: false
      description: '`/v2/analyze` 回應的追蹤與自然語言解析中繼資料，用來辨識請求、實際輸入模式及解析診斷。'
      properties:
        request_id:
          description: 此次分析請求的非空追蹤識別字，可用於對照日誌與錯誤回應。
          minLength: 1
          title: Request Id
          type: string
        client_id:
          description: 原分析請求提供的呼叫端識別字，用於稽核與追蹤，不作為授權依據。
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Client Id
          type: string
        input_mode:
          description: 實際採用的輸入模式：`text` 為純文字、`url` 為職缺網址、`url_text` 為網址加補充文字。
          enum:
          - text
          - url
          - url_text
          title: Input Mode
          type: string
        query_used:
          description: 分析流程實際使用的查詢文字；可能是原始文字，或由支援的職缺網址擷取並整理後的內容。
          title: Query Used
          type: string
        nlq:
          description: 自然語言解析的狀態，以及已套用、忽略或仍缺少的條件診斷。
          $ref: '#/components/schemas/NLQDiagnostics'
      required:
      - request_id
      - client_id
      - input_mode
      - query_used
      - nlq
      title: AnalyzeMetadata
      type: object
    SearchMetadata:
      additionalProperties: false
      description: '`/v2/search` 回應的追蹤與搜尋診斷中繼資料，包含查詢建議及排序策略資訊。'
      properties:
        request_id:
          description: 此次搜尋請求的非空追蹤識別字，可用於對照日誌與錯誤回應。
          minLength: 1
          title: Request Id
          type: string
        client_id:
          description: 原搜尋請求提供的呼叫端識別字，用於稽核與追蹤，不作為授權依據。
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9._-]+$
          title: Client Id
          type: string
        suggestion:
          description: 查詢建議的狀態、建議文字、原因及缺漏資訊診斷。
          $ref: '#/components/schemas/QuerySuggestion'
        ranking:
          description: 此次搜尋使用的排序策略及是否採用備援排序。
          $ref: '#/components/schemas/RankingDiagnostics'
      required:
      - request_id
      - client_id
      - suggestion
      - ranking
      title: SearchMetadata
      type: object
    NLQDiagnostics:
      additionalProperties: false
      description: '`/v2/analyze` 的自然語言解析診斷；除 `status` 外的陣列皆為選填，僅在回應提供時解釋解析結果。'
      properties:
        status:
          description: 解析狀態：`parsed` 表示成功解析、`partial` 表示僅解析部分條件、`fallback` 表示改用詞彙式備援處理。
          enum:
          - parsed
          - partial
          - fallback
          title: Status
          type: string
        applied_filters:
          description: 回應有提供時，列出成功套用的條件；空陣列表示沒有可列出的已套用條件。
          items:
            type: string
          title: Applied Filters
          type: array
        ignored_filters:
          description: 回應有提供時，列出未採用的條件；空陣列表示沒有可列出的忽略條件。
          items:
            type: string
          title: Ignored Filters
          type: array
        missing_information:
          description: 回應有提供時，列出完成解析仍缺少的資訊；空陣列表示沒有可列出的缺漏資訊。
          items:
            type: string
          title: Missing Information
          type: array
      required:
      - status
      title: NLQDiagnostics
      type: object
    QuerySuggestion:
      additionalProperties: false
      description: '`/v2/search` 中繼資料的查詢建議診斷，說明是否需要且能否產生補充查詢，以及仍缺少的資訊。'
      properties:
        status:
          description: 建議狀態：`not_needed` 表示不需要建議、`generated` 表示已產生建議、`unavailable` 表示目前無法提供建議。
          enum:
          - not_needed
          - generated
          - unavailable
          title: Status
          type: string
        suggested_query:
          description: 產生的建議查詢文字；沒有產生建議時為 `null`，且此選填欄位也可能不提供。
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Suggested Query
        reason:
          description: 建議狀態或建議內容的可讀原因；沒有可說明原因時為 `null`，且此選填欄位也可能不提供。
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Reason
        missing_information:
          description: 產生更精確查詢仍缺少的資訊；空陣列表示沒有可列出的缺漏資訊，且此選填欄位可能不提供。
          items:
            type: string
          title: Missing Information
          type: array
      required:
      - status
      title: QuerySuggestion
      type: object
    RankingDiagnostics:
      additionalProperties: false
      description: '`/v2/search` 中繼資料的排序診斷，指出此次結果採用的排序策略及是否啟用備援排序。'
      properties:
        strategy:
          description: 此次搜尋採用的排序策略識別字或名稱；可依實際執行策略而異。
          title: Strategy
          type: string
        fallback_used:
          description: 是否因主要排序不可用或不適用而使用備援排序；`true` 表示已使用，`false` 表示未使用。
          title: Fallback Used
          type: boolean
      required:
      - strategy
      - fallback_used
      title: RankingDiagnostics
      type: object
    HealthResponse:
      additionalProperties: false
      description: '`GET /health` 的健康檢查成功回應，表示 API 可正常回應健康探測。'
      examples:
      - status: ok
      properties:
        status:
          description: 固定為 `ok`，表示健康檢查成功。
          const: ok
          default: ok
          title: Status
          type: string
      title: HealthResponse
      type: object
    ErrorResponse:
      additionalProperties: false
      description: 各 API 錯誤狀態共用的回應封套，將錯誤代碼、訊息與請求追蹤識別字收納於 `error`。
      examples:
      - error:
          code: INVALID_QUERY
          message: 查詢格式不正確
          request_id: 18da32d6-6450-4ef3-91d0-81e7780b15ba
      properties:
        error:
          description: 此次失敗的機器可讀代碼、可讀訊息及請求追蹤識別字。
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    ErrorDetail:
      additionalProperties: false
      description: 統一錯誤回應中的詳細內容，提供機器可讀代碼、使用者可讀訊息及請求追蹤識別字。
      properties:
        code:
          description: 機器可讀的錯誤代碼字串；實際值依發生的錯誤情境而定。
          title: Code
          type: string
        message:
          description: 說明錯誤原因的可讀訊息。
          title: Message
          type: string
        request_id:
          description: 發生錯誤之請求的非空追蹤識別字，可用於對照日誌。
          minLength: 1
          title: Request Id
          type: string
      required:
      - code
      - message
      - request_id
      title: ErrorDetail
      type: object
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 使用一組共用 API Gateway 金鑰。client_id 是稽核上下文，不是授權選擇器。
