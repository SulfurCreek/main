<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  /* Figma B.1 公司資料 / node 8681-2374 「Modal」 variables */
  :root{
    --Basic-Grey-Primary:#212428;
    --Basic-Grey-Secondary:#424751;
    --Basic-White:#ffffff;
    --Surface-Primary-Primary:#1a66ff;
    --Text-Primary-Tertiary:#0b378f;
    --Icon-Primary-Primary:#1a66ff;
    --Border-100:#dae1e7;
    --Radius-Small:8px;
    --Radius-Large:16px;
    --Popup-Shadow:0 1px 6px rgba(37,38,40,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    width:800px;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:#f8f9fa;
    font-family:Roboto,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .modal{
    width:720px;height:488px;
    display:flex;flex-direction:column;
    background:var(--Basic-White);
    border-radius:var(--Radius-Large);
    box-shadow:var(--Popup-Shadow);
    overflow:hidden;
  }
  /* Content 720x428 */
  .modal-content{
    flex:1;
    padding:114px 0 0 32px;   /* Text frame x=32 / y=114 */
    padding-bottom:32px;
  }
  .text-col{width:332px;display:flex;flex-direction:column;}
  .title{                     /* EN/Headline/24 M */
    font-size:24px;font-weight:500;line-height:32px;
    color:var(--Basic-Grey-Primary);
  }
  .body-text{                 /* CH/Body/16 */
    margin-top:16px;
    font-size:16px;font-weight:400;line-height:24px;
    color:var(--Basic-Grey-Secondary);
  }
  .btn-primary{               /* Button 156x48 / btn-l */
    margin-top:32px;
    display:flex;align-items:center;justify-content:center;
    min-width:156px;width:156px;height:48px;padding:12px 20px;
    font-size:16px;font-weight:500;line-height:24px;
    color:var(--Basic-White);
    background:var(--Surface-Primary-Primary);
    border:none;border-radius:var(--Radius-Small);cursor:pointer;
  }
  .checkbox-row{
    margin-top:12px;
    display:flex;align-items:center;column-gap:8px;
  }
  .checkbox-box{
    width:20px;height:20px;border-radius:4px;
    border:1.5px solid #bbc4cb;background:#fff;
  }
  .checkbox-label{
    font-size:16px;font-weight:400;line-height:24px;
    color:var(--Basic-Grey-Secondary);
  }
  /* Footer 720x60，link button 122x28 @ x=574 y=16 */
  .modal-footer{
    height:60px;flex-shrink:0;
    display:flex;align-items:center;justify-content:flex-end;
    padding:16px 24px;
    border-top:1px solid var(--Border-100);
  }
  .btn-ghost{
    display:flex;align-items:center;column-gap:4px;
    height:28px;padding:2px 2px 2px 4px;
    background:none;border:none;cursor:pointer;
    font-size:16px;font-weight:500;line-height:24px;
    color:var(--Text-Primary-Tertiary);
  }
  .btn-ghost .arrow{
    width:16px;height:16px;display:inline-block;
    color:var(--Icon-Primary-Primary);
  }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal-content">
      <div class="text-col">
        <div class="title">職務類別：工讀生停用說明</div>
        <div class="body-text">為增加人才媒合精準度，我們已下架「工讀生」職務類別，請檢視您目前的職缺設定，將您的工讀生職缺改為新的類別</div>
        <button class="btn-primary">我知道了</button>
        <div class="checkbox-row">
          <span class="checkbox-box"></span>
          <span class="checkbox-label">不再顯示</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost">
        <span>前往職缺總覽確認職缺</span>
        <svg class="arrow" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</body>
</html>
